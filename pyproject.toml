[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-motor-fault"
version = "0.1.0"
description = "Physics-informed neural fault classification on the Paderborn University bearing dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
]

[project.optional-dependencies]
paderborn = [
  "scipy>=1.14",
]
dev = [
  "pytest>=8",
]

[project.scripts]
pinn-motor-fault = "pinn_motor_fault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

